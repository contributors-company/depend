name: depend
description: "depend simplifies dependency management in Flutter apps, providing easy initialization and access to services across the widget tree."
version: 5.1.2

homepage: https://www.contributors.info/repository/depend

repository: https://github.com/AlexHCJP/depend

issue_tracker: https://github.com/AlexHCJP/depend/issues

topics:
  - dependency
  - injection
  - dependency-injection
  - service
  - dependency-management

funding:
  - https://www.patreon.com/c/Contributors

screenshots:
  - description: 'Depend Dependency Injection Logo Flutter'
    path: screenshots/depend-logo.png
  - description: 'Frame Depend Dependency Injection Flutter'
    path: screenshots/depend-frame.png


platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
